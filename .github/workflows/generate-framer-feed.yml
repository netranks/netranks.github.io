name: Generate Framer Feed

on:
  push:
    paths:
      - 'blog/**'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Generate framer-feed.json
        run: node scripts/generate-framer-feed.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add framer-feed.json
          git diff --staged --quiet || git commit -m "Update framer-feed.json"
          git push